org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true

# Default public registries; see settings.gradle. Override with the matching
# ECHOAPP_GRADLE_REPO_{ANDROID,GOOGLE,PLUGINS} environment variable to resolve
# through a private mirror without editing this tree.
mavenRepoAndroid=https://repo.maven.apache.org/maven2
mavenRepoGoogle=https://dl.google.com/dl/android/maven2
mavenRepoPlugins=https://plugins.gradle.org/m2/

# Releases upload to Maven Central through the Central Portal. The first release remains in
# validation for manual inspection; automatic release can be enabled only after that release is
# verified. Signing stays off for local builds; the release workflow re-enables it.
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=false
RELEASE_SIGNING_ENABLED=false

VERSION_NAME=0.1.0-beta10
GROUP=xyz.block.echoapp

POM_DESCRIPTION=Echo Android client and plugin API
POM_INCEPTION_YEAR=2023
POM_URL=https://github.com/block/echoapp
POM_SCM_URL=https://github.com/block/echoapp
POM_SCM_CONNECTION=scm:git:git://github.com/block/echoapp.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/block/echoapp.git
POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=block
POM_DEVELOPER_NAME=Block, Inc.
POM_DEVELOPER_URL=https://github.com/block/
